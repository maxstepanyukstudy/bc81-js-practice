<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BC81 JS Practice - 12-01 - pagination</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <script src=" https://cdn.jsdelivr.net/npm/izitoast@1.4.0/dist/js/iziToast.min.js "></script>
    <link
      href=" https://cdn.jsdelivr.net/npm/izitoast@1.4.0/dist/css/iziToast.min.css "
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/axios@1.18.1/dist/axios.min.js"></script>

    <link rel="stylesheet" href="style.css" />

    <style></style>
  </head>

  <body>
    <a href="/">home</a>

    <ul class="posts"></ul>
    <button type="button" class="btn">Fetch posts</button>

    <script>
      const fetchPostsBtn = document.querySelector('.btn');
      const postList = document.querySelector('.posts');

      // Controls the group number
      let page = 1;
      // Controls the number of items in the group
      let limit = 40;
      // In our case total number of pages is calculated on frontend
      const totalPages = Math.ceil(100 / limit);

      fetchPostsBtn.addEventListener('click', async () => {
        // Check the end of the collection to display an alert
        if (page > totalPages) {
          return iziToast.error({
            position: 'topRight',
            message: "We're sorry, there are no more posts to load",
          });
        }

        try {
          const posts = await fetchPosts();
          renderPosts(posts);
          // Increase the group number
          page += 1;

          // Replace button text after first request
          if (page > 1) {
            fetchPostsBtn.textContent = 'Fetch more posts';
          }
        } catch (error) {
          console.log(error);
        }
      });

      async function fetchPosts() {
        const params = new URLSearchParams({
          _limit: limit,
          _page: page,
        });

        const response = await axios.get(
          `https://jsonplaceholder.typicode.com/posts?${params}` // verbose exaple
        );
        return response.data;
      }

      function renderPosts(posts) {
        const markup = posts
          .map(({ id, title, body, userId }) => {
            return `<li>
          <h2 class="post-title">${title.slice(0, 30)}</h2>
          <p><b>Post id</b>: ${id}</p>
          <p><b>Author id</b>: ${userId}</p>
          <p class="post-body">${body}</p>
        </li>`;
          })
          .join('');
        postList.insertAdjacentHTML('beforeend', markup);
      }
    </script>
  </body>
</html>
